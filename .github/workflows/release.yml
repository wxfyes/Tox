name: Build Tox Dual-Core Version

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release Version (e.g. v1.0.0)'
        required: true
        default: 'v1.26.3'
      release_notes:
        description: 'Release Notes'
        required: false
        default: 'Manual build from Tox Dual-Core'

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        goos: [linux]
        goarch: [amd64, arm64]
        include:
          - goarch: amd64
            arch_name: 64
          - goarch: arm64
            arch_name: arm64-v8a
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          check-latest: true

      - name: Build
        run: |
          export CGO_ENABLED=0
          go build -v -trimpath -tags "with_quic with_dhcp with_wireguard with_utls" -ldflags="-s -w -X github.com/InazumaV/V2bX/cmd.version=${{ github.event.inputs.version }}" -o tox ./main.go

      - name: Prepare Package
        run: |
          mkdir -p release
          cp tox release/
          cp example/geoip.dat release/ || true
          cp example/geosite.dat release/ || true
          cp example/config.json release/ || true
          cp example/dns.json release/ || true
          cp example/route.json release/ || true
          cp example/custom_outbound.json release/ || true
          cp example/custom_inbound.json release/ || true
          cd release
          zip -r ../Tox-linux-${{ matrix.arch_name }}.zip .

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Tox-linux-${{ matrix.arch_name }}
          path: Tox-linux-${{ matrix.arch_name }}.zip

  release:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten Artifacts
        run: |
          mkdir -p final_release
          find artifacts -name "*.zip" -exec cp {} final_release/ \;
          ls -R final_release

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version }}
          name: Release ${{ github.event.inputs.version }}
          body: ${{ github.event.inputs.release_notes }}
          files: final_release/*.zip
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
